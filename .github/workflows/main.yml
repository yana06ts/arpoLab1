# Название всего автоматического процесса
name: Unity 2D Platformer CI/CD

# Запуск: push в main и в ветки лабораторных, а также вручную из вкладки Actions
on:
  push:
    branches: [main, LR3, LR4, LR5, LR6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ЗАДАЧА 1: быстрая диагностика структуры проекта (Sanity Check)
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity project and deployment files
        run: |
          echo "=== Проверка наличия метаданных Unity и файлов доставки ==="
          test -d ProjectSettings
          test -d Packages
          test -f Assets/Editor/BuildManager.cs
          test -f Assets/Scripts/GameAssembly.asmdef
          test -f Assets/Tests/EditMode/Tests.asmdef
          test -f Assets/Tests/PlayMode/PlayModeTests.asmdef
          test -f Dockerfile
          test -f nginx.conf
          find Assets/ -name '*Controller.cs' -print
          find Assets/ -name 'BuildManager.cs' -print
          find Assets/Tests -name '*.cs' -print

  # ЭТАП 2 (ЛР №4): автоматический запуск тестов Unity (EditMode + PlayMode)
  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      # Кэш папки Library: импорт ассетов выполняется один раз
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      # Официальный CLI GameCI с фиксированной версией
      - name: Install GameCI CLI
        run: |
          curl -sL -o game-ci.tar.gz https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> $GITHUB_PATH

      # CLI вызывается напрямую (а не через game-ci/unity-test-runner@v4): экшен передаёт
      # флаг --no-coverageEnabled, которого CLI не понимает. Coverage выключен, потому что
      # инструментирование кода роняет Unity 6 в контейнере (SIGSEGV, exit code 139).
      # Версия Unity совпадает с ProjectSettings/ProjectVersion.txt проекта.
      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
            --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion=6000.3.2f1 --coverageEnabled=false \
            --artifactsPath=artifacts --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # Результаты и логи тестов сохраняются артефактом даже при падении
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  # ЭТАП 3 (ЛР №5): настоящая компиляция WebGL-игры в облаке
  build_game:
    needs: run_tests # запускается только если все тесты ЛР №4 прошли
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Build-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      # Облачный компилятор Unity 6 от GameCI вызывает метод из ЛР №1
      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: BuildManager.BuildWebGL
          unityVersion: 6000.3.2f1

      - name: Check build output
        run: |
          ls -la Builds/WebGL Builds/WebGL/Build
          test -f Builds/WebGL/index.html

      # Настоящие скомпилированные файлы передаются следующим задачам через артефакт
      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

  # ЗАДАЧА: копирование ветки в резервный репозиторий (ЛР №2), только после успешных тестов
  mirror_repo:
    needs: run_tests
    if: github.repository == 'yana06ts/arpoLab1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push current branch to backup repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          test -n "$BACKUP_TOKEN" || { echo "BACKUP_TOKEN is not configured"; exit 1; }
          BASIC_AUTH=$(printf 'x-access-token:%s' "$BACKUP_TOKEN" | base64 -w0)
          echo "::add-mask::$BASIC_AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $BASIC_AUTH" push \
            https://github.com/yana06ts/arpoLab2.git "HEAD:refs/heads/$GITHUB_REF_NAME"

  # ЭТАП 4 (ЛР №5): Docker-образ с НАСТОЯЩЕЙ игрой вместо заглушек
  build_docker_image:
    needs: build_game
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Вместо заглушек из ЛР №3 скачиваем живой билд из задачи build_game
      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image with the real game
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/yana06ts/platformer-game:latest
            ghcr.io/yana06ts/platformer-game:${{ github.sha }}

  # ЭТАП 5 (ЛР №5): автоматический деплой игры на GitHub Pages
  deploy_to_pages:
    needs: build_game
    runs-on: ubuntu-latest
    permissions:
      contents: write # публикация в ветку gh-pages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      # .nojekyll: GitHub Pages не должен обрабатывать файлы игры через Jekyll
      - name: Disable Jekyll
        run: touch Builds/WebGL/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages

  # ЭТАП 6 (ЛР №6): Telegram-оповещение о результате пайплайна (webhook в Telegram Bot API)
  notify:
    needs: [sanity_check, run_tests, build_game, mirror_repo, build_docker_image, deploy_to_pages]
    if: always() # аналог after_script: выполняется при любом исходе остальных задач
    runs-on: ubuntu-latest
    steps:
      # Находим первую задачу, которая завершилась не успешно
      - name: Determine pipeline status
        id: status
        run: |
          if   [ "${{ needs.sanity_check.result }}" != "success" ]; then echo "stage=sanity_check" >> $GITHUB_OUTPUT
          elif [ "${{ needs.run_tests.result }}" != "success" ]; then echo "stage=run_tests" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build_game.result }}" != "success" ]; then echo "stage=build_game" >> $GITHUB_OUTPUT
          elif [ "${{ needs.mirror_repo.result }}" != "success" ]; then echo "stage=mirror_repo" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build_docker_image.result }}" != "success" ]; then echo "stage=build_docker_image" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy_to_pages.result }}" != "success" ]; then echo "stage=deploy_to_pages" >> $GITHUB_OUTPUT
          else echo "stage=none" >> $GITHUB_OUTPUT
          fi

      # Токен бота и chat_id берутся только из секретов: в логе они маскируются звёздочками
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STAGE: ${{ steps.status.outputs.stage }}
          SITE_URL: "https://yana06ts.github.io/arpoLab1/"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          test -n "$BOT_TOKEN" || { echo "Секрет TELEGRAM_BOT_TOKEN не задан"; exit 1; }
          test -n "$CHAT_ID" || { echo "Секрет TELEGRAM_CHAT_ID не задан"; exit 1; }
          COMMIT_TITLE=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          if [ "$STAGE" = "none" ]; then
            TEXT=$(printf '✅ Сборка arpoLab1 завершена успешно\nВетка: %s\nКоммит: %s\nАвтор коммита: %s\nИгра доступна: %s\nПрогон: %s' \
              "$BRANCH" "$COMMIT_TITLE" "$AUTHOR" "$SITE_URL" "$RUN_URL")
          else
            TEXT=$(printf '❌ Сборка arpoLab1 упала на задаче %s\nВетка: %s\nКоммит: %s\nАвтор коммита: %s\nЛог прогона: %s' \
              "$STAGE" "$BRANCH" "$COMMIT_TITLE" "$AUTHOR" "$RUN_URL")
          fi
          # jq собирает корректный JSON: кавычки и переводы строк в тексте экранируются автоматически
          PAYLOAD=$(jq -n --arg chat_id "$CHAT_ID" --arg text "$TEXT" '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          # Печатаем только признак успеха, не весь ответ
          echo "Telegram ok: $(echo "$RESPONSE" | jq -r '.ok')"
          echo "$RESPONSE" | jq -e '.ok == true' > /dev/null || { echo "Ошибка Telegram: $(echo "$RESPONSE" | jq -r '.description')"; exit 1; }
