server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    gzip off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Unity already compressed these assets: do not compress them again.
    # ЛР №3: сборка Gzip без Decompression Fallback -> файлы *.gz
    location ~* \.js\.gz$ {
        types { }
        default_type application/javascript;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }
    location ~* \.wasm\.gz$ {
        types { }
        default_type application/wasm;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }
    location ~* \.data\.gz$ {
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    # ЛР №5: сборка Gzip с Decompression Fallback -> файлы *.unityweb (внутри тот же gzip).
    # Nginx сообщает браузеру Content-Encoding: gzip, и распаковку делает сам браузер;
    # JS-распаковщик Unity нужен только на хостингах без этого заголовка (GitHub Pages).
    location ~* \.js\.unityweb$ {
        types { }
        default_type application/javascript;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }
    location ~* \.wasm\.unityweb$ {
        types { }
        default_type application/wasm;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }
    location ~* \.data\.unityweb$ {
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }
}
